<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-label="UPBD's price implied cash flow shrinking 3.2 percent a year, against a base case of growing 2 percent a year" font-family="ui-monospace, Menlo, monospace" font-size="16"><line x1="60" x2="660" y1="96" y2="96" stroke="#333333" stroke-width="2"/><rect x="227.39999999999998" y="89" width="312.6" height="14" fill="#ff5a1f" opacity="0.28"/><line x1="227.39999999999998" x2="227.39999999999998" y1="85" y2="107" stroke="#ffffff" stroke-width="2"/><text x="227.39999999999998" y="54" fill="#ffffff" text-anchor="middle" font-size="18">-3.2% a year</text><text x="227.39999999999998" y="76" fill="#8c8c8c" text-anchor="middle" font-size="16">priced in</text><line x1="540" x2="540" y1="85" y2="107" stroke="#ffffff" stroke-width="2"/><text x="540" y="54" fill="#ffffff" text-anchor="middle" font-size="18">+2% a year</text><text x="540" y="76" fill="#8c8c8c" text-anchor="middle" font-size="16">base case</text><text x="60" y="130" fill="#8c8c8c" text-anchor="middle" font-size="16">-6%</text><text x="660" y="130" fill="#8c8c8c" text-anchor="middle" font-size="16">+4%</text><text x="360" y="168" fill="#ff5a1f" text-anchor="middle" font-size="16">the screen scores this gap</text></svg>
